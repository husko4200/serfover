<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SERFOVER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 1rem;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }
        .tab-btn:hover {
            color: var(--text-primary);
            background-color: rgba(255,255,255,0.05);
        }
        .tab-btn.active {
            color: var(--brand-primary);
            background-color: rgba(16, 185, 129, 0.1);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .driver-badge {
            background-color: var(--bg-tertiary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .view-btn {
            background-color: transparent;
            color: var(--brand-secondary);
            border: 1px solid var(--border-light);
            padding: 0.3rem 0.7rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all var(--transition-fast);
        }
        .view-btn:hover {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: var(--brand-secondary);
        }
        
        /* Modal para ver detalles/imágenes */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-lg);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.5rem;
        }
        .close-btn:hover {
            color: var(--accent-danger);
        }
        .modal-body {
            padding: 1.5rem;
        }
        .modal-body img {
            max-width: 100%;
            border-radius: var(--radius-md);
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-placeholder" style="width: 32px; height: 32px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <h3>SERFOVER</h3>
            </div>
            <div class="sidebar-nav">
                <div class="nav-item active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Panel Principal
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar" style="background-color: var(--brand-secondary);">D</div>
                    <div class="user-details">
                        <h4 id="userNameDisplay">Dueño</h4>
                        <span id="userRoleDisplay">Administrador</span>
                    </div>
                </div>
                <button id="logoutBtn" class="btn btn-secondary btn-block" style="font-size: 0.8rem; padding: 0.5rem;">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="page-title">Panel Administrativo</h2>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <button class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.85rem;" onclick="loadData()">Actualizar</button>
                    <button id="logoutBtnMobileDash" class="btn-icon mobile-logout" onclick="document.getElementById('logoutBtn').click()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </header>

            <div class="content-area">
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        </div>
                        <div class="stat-info">
                            <h3 id="statViajes">0</h3>
                            <p>Viajes este mes</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="color: var(--accent-danger); background-color: rgba(239,68,68,0.1);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        </div>
                        <div class="stat-info">
                            <h3 id="statGastos">$0</h3>
                            <p>Gastos (Comb. + Mant.)</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="tabs">
                        <button class="tab-btn active" onclick="switchDashTab('reportes')">Reportes de Ruta</button>
                        <button class="tab-btn" onclick="switchDashTab('combustible')">Combustible</button>
                        <button class="tab-btn" onclick="switchDashTab('mantencion')">Mantenciones</button>
                    </div>

                    <div id="dash-reportes" class="tab-content active">
                        <div class="table-container">
                            <table id="tableReportes">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Conductor</th>
                                        <th>Móvil</th>
                                        <th>Fundo/Destino</th>
                                        <th>N° Guía</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dinámico -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="dash-combustible" class="tab-content">
                        <div class="table-container">
                            <table id="tableCombustible">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Conductor</th>
                                        <th>Litros</th>
                                        <th>Kilometraje</th>
                                        <th>Costo ($)</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dinámico -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="dash-mantencion" class="tab-content">
                        <div class="table-container">
                            <table id="tableMantencion">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Conductor</th>
                                        <th>Descripción</th>
                                        <th>Costo ($)</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dinámico -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal Detalles -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Detalle</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dinámico -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="api.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
