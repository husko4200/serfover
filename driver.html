<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Conductor - SERFOVER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 1rem;
            overflow-x: auto;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        .tab-btn:hover {
            color: var(--text-primary);
            background-color: rgba(255,255,255,0.05);
        }
        .tab-btn.active {
            color: var(--brand-primary);
            background-color: rgba(16, 185, 129, 0.1);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-placeholder" style="width: 32px; height: 32px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <h3>SERFOVER</h3>
            </div>
            <div class="sidebar-nav">
                <div class="nav-item active" onclick="switchTab('reporte')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Ingresar Reporte
                </div>
                <div class="nav-item" onclick="switchTab('combustible')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22v-8c0-1.1.9-2 2-2h14a2 2 0 0 1 2 2v8"></path><path d="M12 12v-6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6"></path><circle cx="12" cy="18" r="2"></circle></svg>
                    Combustible
                </div>
                <div class="nav-item" onclick="switchTab('mantencion')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                    Mantención
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar">C</div>
                    <div class="user-details">
                        <h4 id="userNameDisplay">Conductor</h4>
                        <span id="userRoleDisplay">Conductor</span>
                    </div>
                </div>
                <button id="logoutBtn" class="btn btn-secondary btn-block" style="font-size: 0.8rem; padding: 0.5rem;">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2 class="page-title" id="pageTitle">Hoja de Ruta</h2>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div class="date-display" id="currentDate" style="display: none;"></div>
                    <button id="logoutBtnMobile" class="btn-icon mobile-logout" onclick="document.getElementById('logoutBtn').click()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </header>

            <div class="content-area">
                
                <!-- REPORTE DE VIAJE -->
                <div id="tab-reporte" class="tab-content active">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Nueva Hoja de Ruta</h3>
                        </div>
                        <form id="formReporte" class="form-grid">
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <h4>Información del Viaje</h4>
                                <hr style="border-color: var(--border-light); margin: 0.5rem 0 1rem 0;">
                            </div>

                            <div class="form-group">
                                <label>Móvil (Ej: Autocargante)</label>
                                <input type="text" id="repMovil" required>
                            </div>
                            <div class="form-group">
                                <label>Kilometraje</label>
                                <input type="number" id="repKilometraje" required>
                            </div>
                            <div class="form-group">
                                <label>Fundo</label>
                                <input type="text" id="repFundo" required>
                            </div>
                            <div class="form-group">
                                <label>Destino</label>
                                <input type="text" id="repDestino" required>
                            </div>
                            <div class="form-group">
                                <label>Sector Faena</label>
                                <input type="text" id="repFaena" required>
                            </div>
                            
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <h4>Datos Adicionales</h4>
                                <hr style="border-color: var(--border-light); margin: 0.5rem 0 1rem 0;">
                            </div>
                            <div class="form-group">
                                <label>Peaje</label>
                                <input type="text" id="repPeaje">
                            </div>
                            <div class="form-group">
                                <label>Romana</label>
                                <input type="text" id="repRomana">
                            </div>
                            <div class="form-group">
                                <label>N° Guía</label>
                                <input type="text" id="repGuia">
                            </div>

                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label>Observaciones</label>
                                <textarea id="repObservaciones" rows="3"></textarea>
                            </div>

                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label>Foto de la Hoja de Ruta</label>
                                <div class="file-upload" onclick="document.getElementById('repImagen').click()">
                                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                    <p>Haz clic para subir imagen o tomar foto</p>
                                    <input type="file" id="repImagen" accept="image/*" style="display:none" onchange="previewImage(this, 'repPreview')">
                                </div>
                                <div id="repPreview" class="image-preview-container">
                                    <img src="" alt="Preview">
                                </div>
                            </div>

                            <div style="grid-column: 1 / -1;">
                                <button type="submit" class="btn btn-primary">Guardar Reporte</button>
                                <div id="repStatus" style="margin-top: 1rem; display: none;"></div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- COMBUSTIBLE -->
                <div id="tab-combustible" class="tab-content">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Carga de Combustible</h3>
                        </div>
                        <form id="formCombustible" class="form-grid">
                            <div class="form-group">
                                <label>Litros Cargados</label>
                                <input type="number" step="0.01" id="combLitros" required>
                            </div>
                            <div class="form-group">
                                <label>Kilometraje Actual</label>
                                <input type="number" id="combKm" required>
                            </div>
                            <div class="form-group">
                                <label>Valor Total Pagado ($)</label>
                                <input type="number" id="combValor" required>
                            </div>
                            
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label>Comprobante de Carga (Boleta/Factura)</label>
                                <div class="file-upload" onclick="document.getElementById('combImagen').click()">
                                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                    <p>Haz clic para subir comprobante</p>
                                    <input type="file" id="combImagen" accept="image/*" style="display:none" onchange="previewImage(this, 'combPreview')">
                                </div>
                                <div id="combPreview" class="image-preview-container">
                                    <img src="" alt="Preview">
                                </div>
                            </div>

                            <div style="grid-column: 1 / -1;">
                                <button type="submit" class="btn btn-primary">Registrar Combustible</button>
                                <div id="combStatus" style="margin-top: 1rem; display: none;"></div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- MANTENCION -->
                <div id="tab-mantencion" class="tab-content">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Registro de Mantenciones</h3>
                        </div>
                        <form id="formMantencion" class="form-grid">
                            <div class="form-group">
                                <label>Tipo de Mantención</label>
                                <select id="mantTipo" required>
                                    <option value="" disabled selected>Selecciona una opción</option>
                                    <option value="Cambio de Aceite">Cambio de Aceite</option>
                                    <option value="Filtros">Filtros</option>
                                    <option value="Neumáticos">Neumáticos</option>
                                    <option value="Frenos">Frenos</option>
                                    <option value="General/Otros">General / Otros</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Kilometraje al momento</label>
                                <input type="number" id="mantKm" required>
                            </div>
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label>Descripción Detallada / Repuestos</label>
                                <textarea id="mantDesc" rows="3" required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Costo Total ($)</label>
                                <input type="number" id="mantValor" required>
                            </div>
                            
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label>Evidencia o Boleta</label>
                                <div class="file-upload" onclick="document.getElementById('mantImagen').click()">
                                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                    <p>Haz clic para subir imagen</p>
                                    <input type="file" id="mantImagen" accept="image/*" style="display:none" onchange="previewImage(this, 'mantPreview')">
                                </div>
                                <div id="mantPreview" class="image-preview-container">
                                    <img src="" alt="Preview">
                                </div>
                            </div>

                            <div style="grid-column: 1 / -1;">
                                <button type="submit" class="btn btn-primary">Registrar Mantención</button>
                                <div id="mantStatus" style="margin-top: 1rem; display: none;"></div>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script src="api.js"></script>
    <script src="driver.js"></script>
</body>
</html>
