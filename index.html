<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERFOVER - Logística Forestal</title>
    <meta name="description" content="Plataforma de gestión de logística forestal para SERFOVER">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="login-body">
    <div class="theme-toggle-wrapper" style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: 50;">
        <button class="btn-icon" onclick="toggleTheme()" aria-label="Toggle Theme" style="background: var(--bg-secondary); border: 1px solid var(--border-color); width: 44px; height: 44px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="serfover_logo.png" alt="SERFOVER Logo" style="max-width: 350px; width: 100%; height: auto; margin-bottom: 1rem; border-radius: 12px; object-fit: contain;">
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>

                <div id="loginError" class="error-message" style="display: none;">
                    Usuario o contraseña incorrectos.
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <span>Iniciar Sesión</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>
        </div>
    </div>
    <script src="app.js?v=6"></script>
</body>
</html>
