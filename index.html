<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SERFOVER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="serfover_logo.png">
</head>
<body class="login-light-body">
    
    <div class="login-light-container">
        <div class="login-light-card">
            <div class="login-light-header">
                <img src="serfover_logo.png" alt="SERFOVER Logo" class="login-light-logo">
                <h1>Bienvenido a SERFOVER</h1>
                <p>Ingresa tus credenciales para acceder a la flota</p>
            </div>
            
            <form id="loginForm" class="login-light-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ej: c.perez" required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div id="loginError" class="login-error-msg" style="display: none;">
                    Usuario o contraseña incorrectos.
                </div>
                
                <button type="submit" class="btn-login-light">
                    Ingresar al Sistema
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>
        </div>
        <p class="login-light-footer">SERFOVER &copy; 2026 — Logística Forestal</p>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered: ', registration.scope);
                }).catch(err => {
                    console.log('SW registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
